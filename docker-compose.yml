services:
  master:
    build:
      context: .
      dockerfile: master/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      SECONDARY_URLS: "http://secondary1:8080,http://secondary2:8080"

  secondary1:
    build:
      context: .
      dockerfile: secondary/Dockerfile
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      REPLICATION_DELAY_MS: "0"

  secondary2:
    build:
      context: .
      dockerfile: secondary/Dockerfile
    ports:
      - "8082:8080"
    environment:
      PORT: "8080"
      REPLICATION_DELAY_MS: "5000"