services:
  master:
    build:
      context: .
      dockerfile: master/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ID: "master"
      SECONDARY_URLS: "secondary1=http://secondary1:8080,secondary2=http://secondary2:8080"

  secondary1:
    build:
      context: .
      dockerfile: secondary/Dockerfile
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      NODE_ID: "secondary1"
      REPLICATION_DELAY_MS: "0"

  secondary2:
    build:
      context: .
      dockerfile: secondary/Dockerfile
    ports:
      - "8082:8080"
    environment:
      PORT: "8080"
      NODE_ID: "secondary2"
      REPLICATION_DELAY_MS: "5000"
